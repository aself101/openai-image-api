name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Publishing is manual (see README "Releasing"); CI gates but never publishes.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check sources and tests
        run: npx tsc --noEmit -p tsconfig.test.json

      # dist/ is committed and the CLI tests run against it; a source change
      # without a rebuild would test one artifact and publish another.
      - name: Build and verify committed dist matches source
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "dist/ is out of date: run npm run build and commit"; exit 1; }

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package contents
        run: npm pack --dry-run
