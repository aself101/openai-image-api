name: CI & Release

on:
  push:
    branches:
      - main

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # dist/ is committed and the CLI tests run against it; a source change
      # without a rebuild would test one artifact and publish another.
      - name: Build and verify committed dist matches source
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "dist/ is out of date: run npm run build and commit"; exit 1; }

      - name: Run tests
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
